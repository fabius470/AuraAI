<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA // Accesso Locale</title>
  <style>
    :root {
      --bg: #07090d;
      --panel: #0e131a;
      --panel-2: #141b24;
      --line: #1e293b;
      --ink: #f8fafc;
      --dim: #94a3b8;
      --cyan: #06b6d4;
      --cyan-dim: rgba(6, 182, 212, 0.14);
      --emerald: #10b981;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.06) 0%, var(--bg) 45%);
      color: var(--ink);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 26px;
    }

    .brand-hd {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 10px;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--cyan-dim);
      border: 1px solid rgba(6, 182, 212, 0.45);
      color: var(--cyan);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .brand-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .sub-copy {
      font-size: 13px;
      color: var(--dim);
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border-radius: 9px;
      background: var(--bg);
      border: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .mode-btn {
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--dim);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--panel-2);
      color: var(--ink);
    }

    .form-row {
      margin-bottom: 14px;
    }

    .form-row label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--dim);
      margin-bottom: 6px;
    }

    .form-row input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font-size: 13.5px;
      outline: none;
    }

    .form-row input:focus {
      border-color: var(--cyan);
    }

    .submit-btn {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: var(--cyan);
      color: #041014;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
    }

    .submit-btn:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 12px;
      min-height: 18px;
      font-size: 12.5px;
      text-align: center;
    }

    .status-msg.err { color: var(--red); }
    .status-msg.ok { color: var(--emerald); }

    .foot-info {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--dim);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand-hd">
      <div class="brand-badge">A</div>
      <div>
        <div class="brand-name">AURA // CORE</div>
        <div class="brand-tag">Local Workspace</div>
      </div>
    </div>

    <p class="sub-copy">Accedi o crea un account per usare la console locale su questo computer.</p>

    <div class="mode-switch">
      <button type="button" class="mode-btn active" id="btnLoginMode" data-mode="login">Accedi</button>
      <button type="button" class="mode-btn" id="btnRegisterMode" data-mode="register">Registrati</button>
    </div>

    <form id="authForm">
      <div class="form-row">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="Nome utente" required />
      </div>

      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" required />
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Accedi</button>
      <div class="status-msg" id="statusMsg"></div>
    </form>

    <div class="foot-info">Persistenza locale attiva • Flask + Ollama</div>
  </div>

  <script>
    (function () {
      var btnLogin = document.getElementById("btnLoginMode");
      var btnRegister = document.getElementById("btnRegisterMode");
      var submitBtn = document.getElementById("submitBtn");
      var passInput = document.getElementById("password");
      var statusMsg = document.getElementById("statusMsg");
      var form = document.getElementById("authForm");
      var currentMode = "login";

      function switchMode(mode) {
        currentMode = mode;
        var isLogin = mode === "login";
        btnLogin.classList.toggle("active", isLogin);
        btnRegister.classList.toggle("active", !isLogin);
        submitBtn.textContent = isLogin ? "Accedi" : "Crea account";
        passInput.autocomplete = isLogin ? "current-password" : "new-password";
        statusMsg.textContent = "";
        statusMsg.className = "status-msg";
      }

      btnLogin.addEventListener("click", function () { switchMode("login"); });
      btnRegister.addEventListener("click", function () { switchMode("register"); });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var username = document.getElementById("username").value.trim();
        var password = passInput.value;
        if (!username || !password) return;

        submitBtn.disabled = true;
        statusMsg.textContent = currentMode === "login" ? "Accesso in corso..." : "Creazione account...";
        statusMsg.className = "status-msg";

        fetch(currentMode === "login" ? "/login" : "/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (res) {
            return res.json().then(function (data) {
              return { ok: res.ok, data: data || {} };
            });
          })
          .then(function (result) {
            if (!result.ok) {
              statusMsg.textContent = result.data.error || "Operazione non riuscita.";
              statusMsg.className = "status-msg err";
              submitBtn.disabled = false;
              return;
            }
            statusMsg.textContent = result.data.message || "Operazione completata...";
            statusMsg.className = "status-msg ok";
            window.location.href = result.data.redirect || "/chat";
          })
          .catch(function () {
            statusMsg.textContent = "Errore di connessione con il server locale.";
            statusMsg.className = "status-msg err";
            submitBtn.disabled = false;
          });
      });
    })();
  </script>
</body>
</html>
